    <main class="container">
        <div class="page-header">
            <h2 class="kn-heading" data-trans-id="deevatige_page.page_title">ದೀವಟಿಗೆ ಸಲಾಂ</h2>
            <p class="kn-subheading" data-trans-id="deevatige_page.page_subtitle">ದೇವರು ಪೇಟೆ ಉತ್ಸವಕ್ಕೆ ಬಿಜಯಂಗೈಯುವ ಮೊದಲು ದೀವಟಿಗೆ ಸಲಾಂ (ದೀಪ ನಮಸ್ಕಾರ) ಸಲ್ಲಿಸುವಾಗ ಹೇಳುವ ಶ್ರೀ ದೇವರ ಸ್ತುತಿ</p>
        </div>

        <div class="seva-list" id="sevaContainer">
            <p style="text-align: center; color: #666;" data-trans-id="common.loading">ಮಾಹಿತಿಯನ್ನು ಲೋಡ್ ಮಾಡಲಾಗುತ್ತಿದೆ...</p>
        </div>

    <div id="footerContainer"></div>

    <script src="../js/footer-loader.js"></script>
    <script src="../js/vendor/sanscript.min.js"></script>
    <script src="../js/localeEngine.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/back-to-top.js"></script>
    <script src="../js/feedback.js"></script>

    <script>
        let currentAudio = null;
        let activeAudioBtn = null;

        function escapeAttr(str) {
            if (!str) return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/>/g, ' ');
        }

        function playVerseAudio(audioPath, plainText, btnEl) {
            if (currentAudio && activeAudioBtn === btnEl) {
                currentAudio.pause();
                resetAudioButton(btnEl);
                currentAudio = null;
                activeAudioBtn = null;
                return;
            }

            if (currentAudio) {
                currentAudio.pause();
                if (activeAudioBtn) resetAudioButton(activeAudioBtn);
            }
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }

            currentAudio = new Audio(audioPath);
            activeAudioBtn = btnEl;
            btnEl.classList.add('playing');
            btnEl.innerHTML = ' <span data-trans-id="common.stop_audio">ನಿಲ್ಲಿಸಿ</span>';
            if (window.LocaleEngine && typeof window.LocaleEngine.updateDomElements === 'function') {
                window.LocaleEngine.updateDomElements(btnEl);
            }

            currentAudio.play().then(function() {
                currentAudio.onended = function() {
                    resetAudioButton(btnEl);
                    currentAudio = null;
                    activeAudioBtn = null;
                };
            }).catch(function(err) {
                console.warn('Audio file missing or blocked, falling back to Web Speech TTS:', err);
                playSpeechTTS(plainText, btnEl);
            });
        }

        function playSpeechTTS(text, btnEl) {
            if (!('speechSynthesis' in window)) {
                alert("ನಿಮ್ಮ ಬ್ರೌಸರ್‌ನಲ್ಲಿ ಶ್ರವಣ ಸೌಲಭ್ಯ ಲಭ್ಯವಿಲ್ಲ.");
                resetAudioButton(btnEl);
                return;
            }

            const utterance = new SpeechSynthesisUtterance(text);
            const voices = window.speechSynthesis.getVoices();
            const selectedVoice = voices.find(function(v) {
                return v.lang.startsWith('sa') || v.lang.startsWith('hi') || v.lang.startsWith('kn');
            });
            
            if (selectedVoice) utterance.voice = selectedVoice;
            utterance.lang = 'kn-IN';
            utterance.rate = 0.85;

            utterance.onend = function() {
                resetAudioButton(btnEl);
                currentAudio = null;
                activeAudioBtn = null;
            };

            window.speechSynthesis.speak(utterance);
        }

        function resetAudioButton(btn) {
            if (!btn) return;
            btn.classList.remove('playing');
            btn.innerHTML = ' <span data-trans-id="common.listen_audio">ಶ್ಲೋಕ ಆಲಿಸಿ</span>';
            if (window.LocaleEngine && typeof window.LocaleEngine.updateDomElements === 'function') {
                window.LocaleEngine.updateDomElements(btn);
            }
        }

        async function loadMarkdownContent() {
            const container = document.getElementById('sevaContainer');
            
            try {
                const response = await fetch('../data/deevatige_salaam.md');
                if (!response.ok) {
                    throw new Error('HTTP error! status: ' + response.status);
                }
                
                const markdownText = await response.text();
                container.innerHTML = '';

                const sections = markdownText.split(/^##\s+/m);

                sections.forEach(function(section, index) {
                    if (index === 0) return;

                    const rawLines = section.split('\n');
                    const sectionTitle = rawLines.shift().trim();
                    
                    const verseLines = [];
                    const explanationLines = [];
                    let inTransliterateBlock = false;
                    let blockScript = 'kannada';

                    rawLines.forEach(function(line) {
                        const trimmedLine = line.trim();
                        if (!trimmedLine) return;

                        if (trimmedLine.startsWith(':::transliterate')) {
                            inTransliterateBlock = true;
                            const match = trimmedLine.match(/sourceScript="([^"]+)"/);
                            blockScript = match ? match[1] : 'kannada';
                            return;
                        }
                        if (trimmedLine === ':::') {
                            inTransliterateBlock = false;
                            return;
                        }

                        if (trimmedLine.startsWith('*')) {
                            explanationLines.push(line);
                        } else {
                            verseLines.push({ text: trimmedLine, transliterate: inTransliterateBlock, script: blockScript });
                        }
                    });

                    const verseItems = verseLines.map(function(v) {
                        if (v.transliterate) {
                            return '<p class="verse-line" data-trans-type="transliterate" data-source-script="' + (v.script || 'kannada') + '">' + v.text + '</p>';
                        }
                        return '<p class="verse-line">' + v.text + '</p>';
                    }).join('');

                    const mainPlainText = verseLines.map(function(v) { return v.text; }).join(' ');
                    const audioPath = '../assets/audio/salaam_' + index + '.mp3';

                    let explanationsJoined = explanationLines.join('\n');
                    if (window.LocaleEngine && typeof window.LocaleEngine.preprocessMarkdown === 'function') {
                        explanationsJoined = window.LocaleEngine.preprocessMarkdown(explanationsJoined);
                    }
                    const explanationHtml = typeof marked !== 'undefined' ? marked.parse(explanationsJoined) : '';

                    let explanationCollapsible = '';
                    if (explanationLines.length > 0) {
                        explanationCollapsible = 
                            '<details class="collapsible-section">' +
                                '<summary class="collapsible-toggle">' +
                                    '<span data-trans-id="common.explanation_title">ವಿವರಣೆ ಮತ್ತು ಭಾವಾರ್ಥ</span>' +
                                    '<span class="toggle-icon">▼</span>' +
                                '</summary>' +
                                '<div class="collapsible-content">' + explanationHtml + '</div>' +
                            '</details>';
                    }

                    const card = document.createElement('article');
                    card.className = 'seva-card';
                    card.innerHTML = 
                        '<div class="seva-body">' +
                            '<div class="audio-play-bar" style="display: flex; justify-content: space-between; align-items: center;">' +
                                '<h3 style="color: #800000; margin: 0; font-family: 'Noto Serif Kannada', serif;" data-trans-type="transliterate" data-source-script="kannada">' + sectionTitle + '</h3>' +
                                '<button class="audio-btn" data-audio-path="' + audioPath + '" data-plain-text="' + escapeAttr(mainPlainText) + '" onclick="playVerseAudio(this.getAttribute('data-audio-path'), this.getAttribute('data-plain-text'), this)">' +
                                    '<span data-trans-id="common.listen_audio">ಶ್ಲೋಕ ಆಲಿಸಿ</span>' +
                                '</button>' +
                            '</div>' +
                            (verseLines.length > 0 ? '<div class="verse-box">' + verseItems + '</div>' : '') +
                        '</div>' +
                        explanationCollapsible;

                    container.appendChild(card);
                });

                if (window.LocaleEngine && typeof window.LocaleEngine.updateDomElements === 'function') {
                    window.LocaleEngine.updateDomElements(container);
                }

            } catch (error) {
                console.error("Error loading markdown:", error);
                container.innerHTML = 
                    '<div style="text-align: center; color: #cc0000; padding: 20px;">' +
                        '<p><strong>ಮಾಹಿತಿಯನ್ನು ಲೋಡ್ ಮಾಡಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ.</strong></p>' +
                        '<p style="font-size: 0.85em; color: #666;">(ಫೈಲ್ ಮಾರ್ಗ <code>../data/deevatige_salaam.md</code> ಸರಿಯಾಗಿದೆಯೇ ಮತ್ತು ಸ್ಥಳೀಯ ಸರ್ವರ್ ಚಾಲನೆಯಲ್ಲಿದೆಯೇ ಎಂದು ಪರೀಕ್ಷಿಸಿ)</p>' +
                    '</div>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadMarkdownContent);
        if (window.LocaleEngine) {
            window.LocaleEngine.onLanguageChange(function() {
                loadMarkdownContent();
            });
        }
    </script>
</body>
