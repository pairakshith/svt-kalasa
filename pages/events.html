    <main class="container">
        <div class="page-header">
            <h2 class="kn-heading">ಉತ್ಸವಗಳು ಮತ್ತು ಕಾರ್ಯಕ್ರಮಗಳ ವಿವರ</h2>
            <p class="kn-subheading">ಮುಂಬರುವ ಧಾರ್ಮಿಕ ಉತ್ಸವಗಳು ಮತ್ತು ಸೇವಾದಾರರ ಪಟ್ಟಿ</p>
        </div>

        <!-- Sticky Search Bar -->
        <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input 
                type="text" 
                id="eventSearch" 
                placeholder="ಉತ್ಸವ, ದಿನಾಂಕ ಅಥವಾ ಸೇವಾದಾರರ ಹೆಸರನ್ನು ಹುಡುಕಿ..." 
            />

        <!-- Empty Results Message -->
        <div id="noResultsMsg" class="no-events-found" style="display: none;">

        </div>

        <!-- Festival Event Cards Container -->
        <div class="festival-card-list" id="eventsContainer">
            <p style="text-align: center; color: #666;">ಮಾಹಿತಿಯನ್ನು ಲೋಡ್ ಮಾಡಲಾಗುತ್ತಿದೆ...</p>

    <footer class="site-footer">

    <script src="../js/main.js"></script>
    <script src="../js/back-to-top.js"></script>
    <script src="../js/feedback.js"></script>
    <script src="../js/transliterate.js"></script>
    <script src="../js/global-search.js"></script>

    <script>
        // Dynamically fetch JSON and construct exact HTML matching main.js expectations
        async function loadEventsData() {
            const container = document.getElementById('eventsContainer');
            try {
                const response = await fetch('../data/events.json');
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);

                const events = await response.json();
                container.innerHTML = '';

                events.forEach(event => {
                    const article = document.createElement('article');
                    article.className = 'festival-card';
                    article.setAttribute('data-date', event.date);
                    article.setAttribute('data-keywords', event.keywords);

                    article.innerHTML = `
                        <div class="date-badge">
                            <span class="day">${event.day}</span>
                            <span class="month-year">${event.monthYear}</span>
                        </div>
                        <div class="card-content">
                            <div class="card-top">
                                <h3 class="event-title">${event.title}</h3>
                                <span class="tithi-tag">${event.tithi}</span>
                            </div>
                            <div class="card-bottom">
                                <div class="sevadaara-info">
                                    <span class="label"> ಸೇವಾದಾರರು:</span>
                                    <span class="name">${event.sevadaarara}</span>
                                </div>
                            </div>
                        </div>
                    `;

                    container.appendChild(article);
                });

                // Call your exact main.js initialization function after rendering cards
                if (typeof initUpcomingEvents === 'function') {
                    initUpcomingEvents();
                }

                // Apply active filter if user typed before data finished fetching
                if (typeof filterCards === 'function') {
                    filterCards();
                }

            } catch (error) {
                console.error("Error loading events JSON:", error);
                container.innerHTML = `
                    <div style="text-align: center; color: #cc0000; padding: 20px;">
                        <p><strong>ಕಾರ್ಯಕ್ರಮದ ಮಾಹಿತಿಯನ್ನು ಲೋಡ್ ಮಾಡಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ.</strong></p>
                        <p style="font-size: 0.85em; color: #666;">(ಫೈಲ್ ಮಾರ್ಗ <code>../data/events.json</code> ಸರಿಯಾಗಿದೆಯೇ ಎಂದು ಪರಿಶೀಲಿಸಿ)</p>
                    </div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadEventsData);
    </script>
</body>
</html>
