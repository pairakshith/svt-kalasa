    <!-- JS Loader -->
    <script type="module" src="../js/svt-main.js"></script>
    <script>
        let currentAudio = null;
        let activeAudioBtn = null;

        // Audio Player Logic with Fallback
        function playVerseAudio(audioPath, plainText, btnEl) {
            // If clicking the currently playing button, pause it
            if (currentAudio && activeAudioBtn === btnEl) {
                currentAudio.pause();
                resetAudioButton(btnEl);
                currentAudio = null;
                activeAudioBtn = null;
                return;
            }

            // Stop any ongoing audio/speech
            if (currentAudio) {
                currentAudio.pause();
                if (activeAudioBtn) resetAudioButton(activeAudioBtn);
            }
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }

            // Attempt to play pre-recorded MP3
            currentAudio = new Audio(audioPath);
            activeAudioBtn = btnEl;
            btnEl.classList.add('playing');
            btnEl.innerHTML = '⏸️ ನಿಲ್ಲಿಸಿ (Stop)';

            currentAudio.play().then(() => {
                currentAudio.onended = () => {
                    resetAudioButton(btnEl);
                    currentAudio = null;
                    activeAudioBtn = null;
                };
            }).catch(() => {
                // Fallback: If MP3 file does not exist, use Web Speech API
                console.warn(`Audio file missing at ${audioPath}, falling back to Web Speech TTS.`);
                playSpeechTTS(plainText, btnEl);
            });
        }

        function playSpeechTTS(text, btnEl) {
            if (!('speechSynthesis' in window)) {
                alert("ನಿಮ್ಮ ಬ್ರೌಸರ್‌ನಲ್ಲಿ ಶ್ರವಣ ಸೌಲಭ್ಯ ಲಭ್ಯವಿಲ್ಲ.");
                resetAudioButton(btnEl);
                return;
            }

            const utterance = new SpeechSynthesisUtterance(text);
            const voices = window.speechSynthesis.getVoices();
            const selectedVoice = voices.find(v => v.lang.startsWith('sa') || v.lang.startsWith('hi') || v.lang.startsWith('kn'));
            
            if (selectedVoice) utterance.voice = selectedVoice;
            utterance.lang = 'kn-IN';
            utterance.rate = 0.85;

            utterance.onend = () => {
                resetAudioButton(btnEl);
                currentAudio = null;
                activeAudioBtn = null;
            };

            window.speechSynthesis.speak(utterance);
        }

        function resetAudioButton(btn) {
            btn.classList.remove('playing');
            btn.innerHTML = '🔊 ಶ್ಲೋಕ ಆಲಿಸಿ';
        }

        async function loadMarkdownContent() {
            const container = document.getElementById('sevaContainer');
            
            try {
                const response = await fetch('../data/deevatige_salaam.md');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const markdownText = await response.text();
                container.innerHTML = '';

                // Split sections by '## ' headers
                const sections = markdownText.split(/^##\s+/m);

                sections.forEach((section, index) => {
                    // Skip the top title block (H1)
                    if (index === 0) return;

                    const rawLines = section.split('\n');
                    const sectionTitle = rawLines.shift().trim(); // First line is section heading
                    
                    const verseLines = [];
                    const explanationLines = [];

                    rawLines.forEach(line => {
                        const trimmedLine = line.trim();
                        if (!trimmedLine) return; // Skip empty lines

                        // Bullet point lines start with '*'
                        if (trimmedLine.startsWith('*')) {
                            explanationLines.push(line);
                        } else {
                            verseLines.push(trimmedLine);
                        }
                    });

                    // Build HTML for verse lines
                    const verseHtml = verseLines
                        .map(line => `<p class="verse-line">${line}</p>`)
                        .join('');

                    // Plain text version for Web Speech fallback
                    const versePlainText = verseLines.join(' ');

                    // Define audio path per section (e.g., ../assets/audio/deevatige/salaam_1.mp3)
                    const audioPath = `../assets/audio/salaam_${index}.mp3`;

                    // Parse explanation bullets using marked.js
                    const explanationHtml = typeof marked !== 'undefined' 
                        ? marked.parse(explanationLines.join('\n')) 
                        : explanationLines.map(l => `<p>${l.replace('*', '').trim()}</p>`).join('');

                    // Build card element
                    const card = document.createElement('article');
                    card.className = 'seva-card';
                    card.innerHTML = `
                        <div class="seva-body">
                            <div class="audio-play-bar">
                                <h3 style="color: #800000; margin: 0; font-family: 'Noto Serif Kannada', serif;">${sectionTitle}</h3>
                                <button class="audio-btn" onclick="playVerseAudio('${audioPath}', \`${versePlainText.replace(/`/g, '\\`')}\`, this)">
                                    🔊 ಶ್ಲೋಕ ಆಲಿಸಿ
                                </button>
                            </div>
                            <div class="verse-box">
                                ${verseHtml}
                            </div>
                        </div>
                        <details class="collapsible-section">
                            <summary class="collapsible-toggle">
                                <span>ವಿವರಣೆ ಮತ್ತು ಭಾವಾರ್ಥ</span>
                                <span class="toggle-icon">▼</span>
                            </summary>
                            <div class="collapsible-content">
                                ${explanationHtml}
                            </div>
                        </details>
                    `;

                    container.appendChild(card);
                });

            } catch (error) {
                console.error("Error loading markdown:", error);
                container.innerHTML = `
                    <div style="text-align: center; color: #cc0000; padding: 20px;">
                        <p><strong>ಮಾಹಿತಿಯನ್ನು ಲೋಡ್ ಮಾಡಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ.</strong></p>
                        <p style="font-size: 0.85em; color: #666;">(ಫೈಲ್ ಮಾರ್ಗ <code>../data/deevatige_salaam.md</code> ಸರಿಯಾಗಿದೆಯೇ ಮತ್ತು ಸ್ಥಳೀಯ ಸರ್ವರ್ ಚಾಲನೆಯಲ್ಲಿದೆಯೇ ಎಂದು ಪರೀಕ್ಷಿಸಿ)</p>
                    </div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadMarkdownContent);
    </script>
</body>
