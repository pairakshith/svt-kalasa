    <style>
        .lang-bar-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .lang-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        .temple-om { font-size: 24px; font-weight: bold; }
        .lang-brand-text { font-size: 18px; font-weight: 600; color: white; }
        .lang-control { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
        .lang-label { font-size: 13px; color: rgba(255, 255, 255, 0.9); }
        .lang-selector-select {
            background-color: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }
        .lang-selector-select option { background-color: #333; color: white; }

        /* Hide Google top banner and widget cleanly without breaking translation */
        .goog-te-banner-frame { display: none !important; }
        body { top: 0px !important; }
        #google_translate_element {
            position: absolute;
            left: -9999px;
            top: -9999px;
        }
    </style>

    <script type="text/javascript">
        function setGoogleTranslateCookie(lang) {
            document.cookie = "googtrans=/kn/" + lang + "; path=/;";
            document.cookie = "googtrans=/kn/" + lang + "; domain=" + window.location.hostname + "; path=/;";
        }

        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'kn',
                includedLanguages: 'en,kn',
                autoDisplay: false
            }, 'google_translate_element');
        }

        function switchLanguage(lang) {
            if (lang === 'en') {
                setGoogleTranslateCookie('en');
            } else {
                setGoogleTranslateCookie('kn');
            }
            window.location.reload();
        }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</head>
<body>

    <header class="site-header site-header--glass">
        <div class="header-container" id="langHeader"></div>
    </header>

    <nav class="main-nav">

        <a href="traditions.html" class="nav-link active">ಆಚರಣೆಗಳು</a>

    <main class="container">
        <div class="page-header">
            <h2 class="kn-heading">ವಿಶೇಷ ಆಚರಣೆಗಳು, ವ್ರತಗಳು ಮತ್ತು ಪೌರಾಣಿಕ ಮಹತ್ವ</h2>
            <p class="kn-subheading">ಶ್ರೀ ವೆಂಕಟರಮಣ ದೇವಸ್ಥಾನದಲ್ಲಿ ನಡೆಯುವ ಪ್ರಮುಖ ಧಾರ್ಮಿಕ ವಿಧಿವಿಧಾನಗಳು</p>
        </div>

        <div class="filter-tabs">
            <button class="tab-btn active" onclick="filterTraditions('all', this)">ಸಂಪೂರ್ಣ ಪುಟ</button>
            <button class="tab-btn" onclick="filterTraditions('chandramana_yugadi', this)">ಚಾಂದ್ರಮಾನ ಯುಗಾದಿ</button>
            <button class="tab-btn" onclick="filterTraditions('sri_rama_navami', this)">ಶ್ರೀ ರಾಮ ನವಮಿ</button>
            <button class="tab-btn" onclick="filterTraditions('chitra_paurnami', this)">ಚಿತ್ರಾ ಪೌರ್ಣಮಿ</button>
            <button class="tab-btn" onclick="filterTraditions('nrusimha_jayanti', this)">ನೃಸಿಂಹ ಜಯಂತಿ</button>
            <button class="tab-btn" onclick="filterTraditions('vaishakha_paurnami', this)">ವೈಶಾಖ ಪೌರ್ಣಮಿ</button>
            <button class="tab-btn" onclick="filterTraditions('rigupakarma', this)">ಋಗುಪಾಕರ್ಮ</button>
            <button class="tab-btn" onclick="filterTraditions('varamahalakshmi_vrata', this)">ವರಮಹಾಲಕ್ಷ್ಮಿ ವ್ರತ</button>
            <button class="tab-btn" onclick="filterTraditions('pavitraropana', this)">ಪವಿತ್ರಾರೋಪಣ</button>
            <button class="tab-btn" onclick="filterTraditions('sri_krishna_janmashtami', this)">ಶ್ರೀ ಕೃಷ್ಣ ಜನ್ಮಾಷ್ಟಮಿ</button>
            <button class="tab-btn" onclick="filterTraditions('sri_ganesha_chaturthi', this)">ಶ್ರೀ ಗಣೇಶ ಚತುರ್ಥಿ</button>
            <button class="tab-btn" onclick="filterTraditions('ananta_chaturdashi', this)">ಅನಂತ ಚತುರ್ದಶಿ</button>

            <button class="tab-btn" onclick="filterTraditions('tulasi_vivaha', this)">ಉತ್ಥಾನ ದ್ವಾದಶಿ - ತುಳಸೀ ವಿವಾಹ</button>
            <button class="tab-btn" onclick="filterTraditions('kartika_vana_bhojana', this)">ಕಾರ್ತಿಕ ಹುಣ್ಣಿಮೆ & ವನ ಭೋಜನ</button>
            <button class="tab-btn" onclick="filterTraditions('vishwaroopa', this)">ವಿಶ್ವರೂಪ ದರ್ಶನ</button>
            <button class="tab-btn" onclick="filterTraditions('mukkoti_dvadashi', this)">ಮುಕ್ಕೋಟಿ ದ್ವಾದಶಿ</button>
            <button class="tab-btn" onclick="filterTraditions('ratha_saptami', this)">ರಥ ಸಪ್ತಮಿ</button>
        </div>

        <div id="content-display">
            <div class="loading-text">ಆಚರಣೆಗಳ ಮಾಹಿತಿಯನ್ನು ಲೋಡ್ ಮಾಡಲಾಗುತ್ತಿದೆ...</div>
        </div>
    </main>

    <div id="google_translate_element"></div>
    <div id="footerContainer"></div>

    <script src="../js/footer-loader.js"></script>
    <script src="../js/back-to-top.js"></script>
    <script src="../js/feedback.js"></script>

    <script>
        let parsedTraditions = [];

        function getCurrentLangFromCookie() {
            const match = document.cookie.match(/googtrans=\/kn\/([a-z]{2})/);
            return match ? match[1] : 'kn';
        }

        function initializeHeader() {
            const headerContainer = document.getElementById('langHeader');
            const currentLang = getCurrentLangFromCookie();

            headerContainer.innerHTML = `
                <div class="lang-bar-container">
                    <div class="lang-brand">
                        <span class="temple-om">ॐ</span>
                        <span class="lang-brand-text">ಶ್ರೀ ವೆಂಕಟರಮಣ ದೇವಸ್ಥಾನ, ಕಳಸ</span>
                    </div>
                    <div class="lang-control">
                        <label for="languageSelect" class="lang-label">
                            <span>ಭಾಷೆ / Language:</span>
                        </label>
                        <select id="languageSelect" class="lang-selector-select">
                            <option value="kn" ${currentLang === 'kn' ? 'selected' : ''}>ಕನ್ನಡ (Kannada)</option>
                            <option value="en" ${currentLang === 'en' ? 'selected' : ''}>English</option>
                        </select>
                    </div>
                </div>`;

            document.getElementById('languageSelect').addEventListener('change', function(e) {
                switchLanguage(e.target.value);
            });
        }

        async function loadTraditionsMarkdown() {
            try {
                const response = await fetch('../data/traditions.md');
                const rawMarkdown = await response.text();

                // Split markdown by "---" separator
                const rawBlocks = rawMarkdown.split('---');

                parsedTraditions = rawBlocks.map(block => {
                    // Extract category from "# CATEGORY: category_name"
                    const categoryMatch = block.match(/# CATEGORY:\s*(\w+)/);
                    const category = categoryMatch ? categoryMatch[1].trim() : 'all';

                    // Remove category tag from raw content before parsing
                    const cleanMarkdown = block.replace(/# CATEGORY:\s*\w+/, '').trim();

                    return {
                        category: category,
                        htmlContent: marked.parse(cleanMarkdown)
                    };
                }).filter(item => item.htmlContent.length > 0);

                renderFilteredTraditions('all');

            } catch (error) {
                console.error("Markdown load error:", error);
                document.getElementById('content-display').innerHTML =
                    `<p style="color:red; text-align:center;">ಮಾಹಿತಿಯನ್ನು ಲೋಡ್ ಮಾಡುವಲ್ಲಿ ದೋಷ ಸಂಭವಿಸಿದೆ.</p>`;
            }
        }

        function filterTraditions(targetCategory, buttonElement) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (buttonElement) buttonElement.classList.add('active');
            renderFilteredTraditions(targetCategory);
        }

        function renderFilteredTraditions(targetCategory) {
            const displayContainer = document.getElementById('content-display');

            const filteredList = (targetCategory === 'all')
                ? parsedTraditions
                : parsedTraditions.filter(item => item.category === targetCategory);

            if (filteredList.length === 0) {
                displayContainer.innerHTML = `<p class="loading-text">ಯಾವುದೇ ಮಾಹಿತಿ ಲಭ್ಯವಿಲ್ಲ.</p>`;
                return;
            }

            displayContainer.innerHTML = filteredList.map(item => `
                <article class="markdown-card">
                    ${item.htmlContent}
                </article>
            `).join('');
        }

        window.addEventListener('DOMContentLoaded', function() {
            initializeHeader();
            loadTraditionsMarkdown();
        });
    </script>
</body>
