    <!-- JS Loader -->

    <!-- Markdown Fetcher and Parser Script -->
    <script>
        let parsedTraditions = [];

        async function loadTraditionsMarkdown() {
            try {
                const response = await fetch('../data/traditions.md');
                const rawMarkdown = await response.text();

                // Split markdown by "---" separator
                const rawBlocks = rawMarkdown.split('---');

                parsedTraditions = rawBlocks.map(block => {
                    // Extract category from "# CATEGORY: category_name"
                    const categoryMatch = block.match(/# CATEGORY:\s*(\w+)/);
                    const category = categoryMatch ? categoryMatch[1].trim() : 'all';

                    // Remove category tag from raw content before parsing
                    const cleanMarkdown = block.replace(/# CATEGORY:\s*\w+/, '').trim();

                    return {
                        category: category,
                        htmlContent: marked.parse(cleanMarkdown)
                    };
                }).filter(item => item.htmlContent.length > 0);

                // Render all items by default on page load
                renderFilteredTraditions('all');

            } catch (error) {
                console.error("Markdown fetch error:", error);
                document.getElementById('traditions-display').innerHTML = 
                    `<p style="color:red; text-align:center;">ಮಾಹಿತಿಯನ್ನು ಲೋಡ್ ಮಾಡುವಲ್ಲಿ ದೋಷ ಸಂಭವಿಸಿದೆ.</p>`;
            }
        }

        function filterTraditions(targetCategory, buttonElement) {
            // Update Active tab styling
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (buttonElement) buttonElement.classList.add('active');

            renderFilteredTraditions(targetCategory);
        }

        function renderFilteredTraditions(targetCategory) {
            const displayContainer = document.getElementById('traditions-display');

            const filteredList = (targetCategory === 'all') 
                ? parsedTraditions 
                : parsedTraditions.filter(item => item.category === targetCategory);

            if (filteredList.length === 0) {
                displayContainer.innerHTML = `<p class="loading-text">ಯಾವುದೇ ಮಾಹಿತಿ ಲಭ್ಯವಿಲ್ಲ.</p>`;
                return;
            }

            displayContainer.innerHTML = filteredList.map(item => `
                <article class="tradition-card">
                    ${item.htmlContent}
                </article>
            `).join('');
        }

        // Initialize loading on DOM Ready
        window.onload = loadTraditionsMarkdown;
    </script>
