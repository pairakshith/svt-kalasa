    <main class="container">
        <div class="page-header">
            <h2 class="kn-heading" data-trans-id="mangala_page.page_title">ಮಂಗಳ</h2>
            <p class="kn-subheading" data-trans-id="mangala_page.page_subtitle">ದೇವರು ಪೇಟೆ ಉತ್ಸವದಿಂದ ಹಿಂದಿರುಗಿ ಗರ್ಭಗುಡಿಗೆ ಹೋದ ನಂತರ ಹೇಳುವ ಮಂಗಳ</p>
        </div>

        <div class="seva-list" id="mangalaContent">
            <p style="text-align: center; color: #666;" data-trans-id="common.loading">ಮಾಹಿತಿಯನ್ನು ಲೋಡ್ ಮಾಡಲಾಗುತ್ತಿದೆ...</p>
        </div>

    <div id="footerContainer"></div>

    <script src="../js/footer-loader.js?v=2"></script>
    <script src="../js/vendor/sanscript.min.js"></script>
    <script src="../js/localeEngine.js"></script>
    <script src="../js/back-to-top.js"></script>
    <script src="../js/feedback.js"></script>

    <script>
        async function loadMangalaMarkdown() {
            const container = document.getElementById('mangalaContent');
            
            try {
                const response = await fetch('../data/mangala.md');
                if (!response.ok) {
                    throw new Error('HTTP error! status: ' + response.status);
                }
                
                const markdownText = await response.text();
                container.innerHTML = '';

                const sections = markdownText.split(/^###\s+/m);

                sections.forEach(function(section, index) {
                    if (index === 0) return;

                    const lines = section.split('\n');
                    const sectionTitle = lines.shift().trim();
                    
                    const verseLines = [];
                    const explanationLines = [];
                    let inTransliterateBlock = false;
                    let blockScript = 'kannada';

                    lines.forEach(function(line) {
                        const trimmedLine = line.trim();
                        if (!trimmedLine) return;

                        if (trimmedLine.startsWith(':::transliterate')) {
                            inTransliterateBlock = true;
                            const match = trimmedLine.match(/sourceScript="([^"]+)"/);
                            blockScript = match ? match[1] : 'kannada';
                            return;
                        }
                        if (trimmedLine === ':::') {
                            inTransliterateBlock = false;
                            return;
                        }

                        if (trimmedLine.startsWith('*')) {
                            let cleanExp = trimmedLine.replace(/^\*\s*/, '');
                            explanationLines.push(cleanExp);
                        } else {
                            verseLines.push({ text: line, transliterate: inTransliterateBlock, script: blockScript });
                        }
                    });

                    const verseItems = verseLines.map(function(v) {
                        if (v.transliterate) {
                            return '<p class="verse-line" data-trans-type="transliterate" data-source-script="' + (v.script || 'kannada') + '">' + v.text + '</p>';
                        }
                        return '<p class="verse-line">' + v.text + '</p>';
                    }).join('');

                    let explanationHtml = explanationLines.map(function(exp) {
                        if (window.LocaleEngine && typeof window.LocaleEngine.preprocessMarkdown === 'function') {
                            exp = window.LocaleEngine.preprocessMarkdown(exp);
                        }
                        return '<p>' + (typeof marked !== 'undefined' ? marked.parseInline(exp) : exp) + '</p>';
                    }).join('');

                    let mainCollapsible = '';
                    if (explanationLines.length > 0) {
                        mainCollapsible = 
                            '<details class="collapsible-section">' +
                                '<summary class="collapsible-toggle">' +
                                    '<span data-trans-id="common.explanation_title">ವಿವರಣೆ ಮತ್ತು ಭಾವಾರ್ಥ</span>' +
                                    '<span class="toggle-icon">▼</span>' +
                                '</summary>' +
                                '<div class="collapsible-content">' + explanationHtml + '</div>' +
                            '</details>';
                    }

                    const card = document.createElement('article');
                    card.className = 'seva-card';
                    card.innerHTML = 
                        '<div class="seva-header" style="display: flex; justify-content: space-between; align-items: center;">' +
                            '<h3 class="seva-title" style="color: #800000; margin: 0; font-family: \'Noto Serif Kannada\', serif;">' + sectionTitle + '</h3>' +
                        '</div>' +
                        '<div class="seva-body">' +
                            (verseLines.length > 0 ? '<div class="verse-box">' + verseItems + '</div>' : '') +
                            mainCollapsible +
                        '</div>';

                    container.appendChild(card);
                });

                if (window.LocaleEngine && typeof window.LocaleEngine.updateDomElements === 'function') {
                    window.LocaleEngine.updateDomElements(container);
                }

            } catch (error) {
                console.error("Error loading markdown:", error);
                container.innerHTML = 
                    '<div style="text-align: center; color: #cc0000; padding: 20px;">' +
                        '<p><strong>ಮಾಹಿತಿಯನ್ನು ಲೋಡ್ ಮಾಡಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ.</strong></p>' +
                        '<p style="font-size: 0.85em; color: #666;">(ಫೈಲ್ ಮಾರ್ಗ <code>../data/mangala.md</code> ಸರಿಯಾಗಿದೆಯೇ ಮತ್ತು ಸ್ಥಳೀಯ ಸರ್ವರ್ ಚಾಲನೆಯಲ್ಲಿದೆಯೇ ಎಂದು ಪರೀಕ್ಷಿಸಿ)</p>' +
                    '</div>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadMangalaMarkdown);
        if (window.LocaleEngine) {
            window.LocaleEngine.onLanguageChange(function() {
                loadMangalaMarkdown();
            });
        }
    </script>
</body>
