    <script>
        // Wrap each ### section (its h3 and everything after it, up to the next h3)
        // in a shared seva-card, so it gets the same look as the Ashtaavadhaana page.
        function wrapSectionsAsCards(container) {
            let card = null;
            let body = null;

            Array.from(container.children).forEach(function (el) {
                if (el.tagName === 'H3') {
                    card = document.createElement('article');
                    card.className = 'seva-card';
                    body = document.createElement('div');
                    body.className = 'seva-body';

                    container.insertBefore(card, el);
                    card.appendChild(el);
                    card.appendChild(body);
                } else if (body) {
                    body.appendChild(el);
                }
            });
        }

        function transformBlocksAndVerses(container) {
            // Apply heading style to generated h3 tags (seva-title comes from ashtaavadhaana.css)
            const headings = container.querySelectorAll('h3');
            headings.forEach(h3 => {
                h3.classList.add('kn-heading', 'seva-title');
            });

            // Transform blockquotes to note-box highlights
            const blockquotes = container.querySelectorAll('blockquote');
            blockquotes.forEach(bq => {
                const div = document.createElement('div');
                div.className = 'note-box highlight';
                div.innerHTML = bq.innerHTML;
                bq.parentNode.replaceChild(div, bq);
            });

            // Group sibling paragraphs inside transliterate blocks into verse-box wrappers
            const transliterateBlocks = container.querySelectorAll('.transliterate-block');
            transliterateBlocks.forEach(block => {
                let currentVerse = null;
                Array.from(block.childNodes).forEach(node => {
                    if (node.nodeName === 'P') {
                        if (!currentVerse) {
                            currentVerse = document.createElement('div');
                            currentVerse.className = 'verse-box';
                            block.insertBefore(currentVerse, node);
                        }
                        currentVerse.appendChild(node);
                    } else {
                        currentVerse = null;
                    }
                });
            });

            wrapSectionsAsCards(container);
        }

        async function loadMangalaMarkdown() {
            const contentSection = document.getElementById('mangalaContent');
            try {
                const response = await fetch('../data/mangala.md');
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                
                let markdownText = await response.text();

                if (window.LocaleEngine && typeof window.LocaleEngine.preprocessMarkdown === 'function') {
                    markdownText = window.LocaleEngine.preprocessMarkdown(markdownText);
                }

                // Process :::transliterate tags directly in raw markdown text
                const transliterateRegex = /:::transliterate(?:\{sourceScript="([^"]+)"\})?([\s\S]*?):::/g;
                
                let preprocessedMarkdown = markdownText.replace(transliterateRegex, (match, script, content) => {
                    const sourceScript = script || 'kannada';
                    let text = content.trim();

                    if (window.LocaleEngine && typeof window.LocaleEngine.getScript === 'function') {
                        const targetScript = window.LocaleEngine.getScript();
                        if (targetScript && targetScript !== sourceScript && window.Sanscript) {
                            text = Sanscript.t(text, sourceScript, targetScript);
                        }
                    }

                    return `\n\n<div class="transliterate-block" data-source-script="${sourceScript}">\n\n${text}\n\n</div>\n\n`;
                });

                // Parse markdown into HTML
                contentSection.innerHTML = marked.parse(preprocessedMarkdown);

                // Perform DOM transformations (heading style, verse boxes, note-boxes, cards)
                transformBlocksAndVerses(contentSection);

                if (window.LocaleEngine && typeof window.LocaleEngine.updateDomElements === 'function') {
                    window.LocaleEngine.updateDomElements(contentSection);
                }

            } catch (error) {
                console.error("Error loading mangala.md:", error);
                contentSection.innerHTML = `
                    <div style="text-align: center; color: #cc0000; padding: 20px;">
                        <p><strong>ಮಾಹಿತಿಯನ್ನು ಲೋಡ್ ಮಾಡಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ.</strong></p>
                        <p style="font-size: 0.85em; color: #666;">(ಫೈಲ್ ಮಾರ್ಗ <code>../data/mangala.md</code> ಸರಿಯಾಗಿದೆಯೇ ಎಂದು ಪರಿಶೀಲಿಸಿ)</p>
                    </div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadMangalaMarkdown);
        if (window.LocaleEngine) {
            window.LocaleEngine.onLanguageChange(function() {
                loadMangalaMarkdown();
            });
        }
    </script>
