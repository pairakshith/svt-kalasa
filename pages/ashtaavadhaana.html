    <script>
        let currentAudio = null;
        let activeAudioBtn = null;

        // Audio Player Logic with Fallback
        function playVerseAudio(audioPath, plainText, btnEl) {
            // If clicking the currently playing button, pause it
            if (currentAudio && activeAudioBtn === btnEl) {
                currentAudio.pause();
                resetAudioButton(btnEl);
                currentAudio = null;
                activeAudioBtn = null;
                return;
            }

            // Stop any ongoing audio/speech
            if (currentAudio) {
                currentAudio.pause();
                if (activeAudioBtn) resetAudioButton(activeAudioBtn);
            }
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }

            // Attempt to play pre-recorded MP3
            currentAudio = new Audio(audioPath);
            activeAudioBtn = btnEl;
            btnEl.classList.add('playing');
            btnEl.innerHTML = '⏸️ ನಿಲ್ಲಿಸಿ (Stop)';

            currentAudio.play().then(() => {
                currentAudio.onended = () => {
                    resetAudioButton(btnEl);
                    currentAudio = null;
                    activeAudioBtn = null;
                };
            }).catch(() => {
                // Fallback: If MP3 file does not exist, use Web Speech API
                console.warn(`Audio file missing at ${audioPath}, falling back to Web Speech TTS.`);
                playSpeechTTS(plainText, btnEl);
            });
        }

        function playSpeechTTS(text, btnEl) {
            if (!('speechSynthesis' in window)) {
                alert("ನಿಮ್ಮ ಬ್ರೌಸರ್‌ನಲ್ಲಿ ಶ್ರವಣ ಸೌಲಭ್ಯ ಲಭ್ಯವಿಲ್ಲ.");
                resetAudioButton(btnEl);
                return;
            }

            const utterance = new SpeechSynthesisUtterance(text);
            const voices = window.speechSynthesis.getVoices();
            const selectedVoice = voices.find(v => v.lang.startsWith('sa') || v.lang.startsWith('hi') || v.lang.startsWith('kn'));
            
            if (selectedVoice) utterance.voice = selectedVoice;
            utterance.lang = 'kn-IN';
            utterance.rate = 0.85;

            utterance.onend = () => {
                resetAudioButton(btnEl);
                currentAudio = null;
                activeAudioBtn = null;
            };

            window.speechSynthesis.speak(utterance);
        }

        function resetAudioButton(btn) {
            btn.classList.remove('playing');
            btn.innerHTML = '🔊 ಶ್ಲೋಕ ಆಲಿಸಿ';
        }

        async function loadMarkdownContent() {
            const container = document.getElementById('sevaContainer');
            
            try {
                const response = await fetch('../data/ashtaavadhaana.md');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const markdownText = await response.text();
                container.innerHTML = '';

                const mainSections = markdownText.split(/^##\s+/m);

                mainSections.forEach((section, index) => {
                    if (index === 0) return;

                    // Separate main block from sub-sections (###)
                    const subSections = section.split(/^###\s+/m);
                    const mainBlock = subSections.shift();

                    const mainLines = mainBlock.split('\n');
                    const sectionTitle = mainLines.shift().trim();
                    
                    const verseLines = [];
                    const explanationLines = [];

                    mainLines.forEach(line => {
                        const trimmedLine = line.trim();
                        if (!trimmedLine) return;

                        if (trimmedLine.startsWith('*')) {
                            explanationLines.push(line);
                        } else {
                            verseLines.push(trimmedLine);
                        }
                    });

                    let versesJoined = verseLines.join('\n');
                    if (window.LocaleEngine && typeof window.LocaleEngine.preprocessMarkdown === 'function') {
                        versesJoined = window.LocaleEngine.preprocessMarkdown(versesJoined);
                    }
                    const verseHtml = marked.parse(versesJoined);

                    const mainPlainText = verseLines.join(' ');
                    const mainAudioPath = `../assets/audio/ashta_${index}.mp3`;

                    let explanationsJoined = explanationLines.join('\n');
                    if (window.LocaleEngine && typeof window.LocaleEngine.preprocessMarkdown === 'function') {
                        explanationsJoined = window.LocaleEngine.preprocessMarkdown(explanationsJoined);
                    }
                    const explanationHtml = typeof marked !== 'undefined' 
                        ? marked.parse(explanationsJoined) 
                        : explanationLines.map(l => `<p>${l.replace('*', '').trim()}</p>`).join('');

                    let mainCollapsible = '';
                    if (explanationLines.length > 0) {
                        mainCollapsible = `
                            <details class="collapsible-section">
                                <summary class="collapsible-toggle">
                                    <span>ವಿವರಣೆ ಮತ್ತು ಭಾವಾರ್ಥ</span>
                                    <span class="toggle-icon">▼</span>
                                </summary>
                                <div class="collapsible-content">
                                    ${explanationHtml}
                                </div>
                            </details>
                        `;
                    }

                    // Process Sub-sections (Extra Verses like Ramayana, Bhagavata, etc.)
                    let subBodyHtml = '';
                    if (subSections.length > 0) {
                        subBodyHtml += `<div class="seva-sub-body">`;
                        
                        subSections.forEach((subSec, subIndex) => {
                            const subLines = subSec.split('\n');
                            const subTitle = subLines.shift().trim();
                            
                            const subVerses = [];
                            const subExplanations = [];
                            let isInvocation = false;
                            let inTransliterateBlock = false;
                            let blockScript = 'kannada';

                            subLines.forEach(line => {
                                const trimmed = line.trim();
                                if (!trimmed) return;

                                if (trimmed.startsWith(':::transliterate')) {
                                    inTransliterateBlock = true;
                                    const match = trimmed.match(/sourceScript="([^"]+)"/);
                                    blockScript = match ? match[1] : 'kannada';
                                    return;
                                }
                                if (trimmed === ':::') {
                                    inTransliterateBlock = false;
                                    return;
                                }

                                if (trimmed.startsWith('>')) {
                                    isInvocation = true;
                                    subVerses.push({ text: trimmed.replace('>', '').trim(), transliterate: false });
                                } else if (trimmed.startsWith('*')) {
                                    subExplanations.push(line);
                                } else {
                                    subVerses.push({ text: trimmed, transliterate: inTransliterateBlock, script: blockScript });
                                }
                            });

                            const subVerseHtml = isInvocation
                                ? `<div class="invocation-box"><p>${subVerses.map(v => v.text).join(' ')}</p></div>`
                                : `<div class="verse-box">${subVerses.map(v => {
                                    if (v.transliterate) {
                                        return `<p class="verse-line" data-trans-type="transliterate" data-source-script="${v.script || 'kannada'}">${v.text}</p>`;
                                    }
                                    return `<p class="verse-line">${v.text}</p>`;
                                }).join('')}</div>`;

                            const subPlainText = subVerses.map(v => v.text).join(' ');
                            const subAudioPath = `../assets/audio/sub_${index}_${subIndex + 1}.mp3`;

                            let expRaw = subExplanations.join('\n');
                            if (window.LocaleEngine && typeof window.LocaleEngine.preprocessMarkdown === 'function') {
                                expRaw = window.LocaleEngine.preprocessMarkdown(expRaw);
                            }

                            const subExpHtml = typeof marked !== 'undefined'
                                ? marked.parse(expRaw)
                                : subExplanations.map(l => `<p>${l.replace('*', '').trim()}</p>`).join('');

                            subBodyHtml += `
                                <div class="audio-play-bar" style="margin-top: 15px;">
                                    <h4 style="color: #800000; margin: 0; font-family: 'Noto Serif Kannada', serif;">${subTitle}</h4>
                                    <button class="audio-btn" onclick="playVerseAudio('${subAudioPath}', \`${subPlainText.replace(/`/g, '\\`')}\`, this)">
                                        🔊 ಶ್ಲೋಕ ಆಲಿಸಿ
                                    </button>
                                </div>
                                ${subVerseHtml}
                                ${subExpHtml ? `
                                <details class="collapsible-section">
                                    <summary class="collapsible-toggle">
                                        <span data-trans-id="common.explanation_title">ವಿವರಣೆ ಮತ್ತು ಭಾವಾರ್ಥ</span>
                                        <span class="toggle-icon">▼</span>
                                    </summary>
                                    <div class="collapsible-content">
                                        ${subExpHtml}
                                    </div>
                                </details>` : ''}
                            `;
                        });

                        subBodyHtml += `</div>`;
                    }

                    // Audio button for main verse section (rendered only if verseLines exist)
                    const mainAudioButtonHtml = verseLines.length > 0 ? `
                        <button class="audio-btn" onclick="playVerseAudio('${mainAudioPath}', \`${mainPlainText.replace(/`/g, '\\`')}\`, this)">
                            🔊 ಶ್ಲೋಕ ಆಲಿಸಿ
                        </button>
                    ` : '';

                    const card = document.createElement('article');
                    card.className = 'seva-card';
                    card.innerHTML = `
                        <div class="seva-header" style="display: flex; justify-content: space-between; align-items: center;">
                            <h3 class="seva-title" style="margin: 0;">${sectionTitle}</h3>
                            ${mainAudioButtonHtml}
                        </div>
                        <div class="seva-body">
                            ${verseLines.length > 0 ? `<div class="verse-box">${verseHtml}</div>` : ''}
                            ${mainCollapsible}
                            ${subBodyHtml}
                        </div>
                    `;

                    container.appendChild(card);
                });

                // Apply translations/transliterations to dynamic elements
                if (window.LocaleEngine && typeof window.LocaleEngine.updateDomElements === 'function') {
                    window.LocaleEngine.updateDomElements(container);
                }

            } catch (error) {
                console.error("Error loading markdown:", error);
                container.innerHTML = `
                    <div style="text-align: center; color: #cc0000; padding: 20px;">
                        <p><strong>ಮಾಹಿತಿಯನ್ನು ಲೋಡ್ ಮಾಡಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ.</strong></p>
                        <p style="font-size: 0.85em; color: #666;">(ಫೈಲ್ ಮಾರ್ಗ <code>../data/ashtaavadhaana.md</code> ಸರಿಯಾಗಿದೆಯೇ ಮತ್ತು ಸ್ಥಳೀಯ ಸರ್ವರ್ ಚಾಲನೆಯಲ್ಲಿದೆಯೇ ಎಂದು ಪರೀಕ್ಷಿಸಿ)</p>
                    </div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadMarkdownContent);
        if (window.LocaleEngine) {
            window.LocaleEngine.onLanguageChange(function() {
                loadMarkdownContent();
            });
        }
    </script>
