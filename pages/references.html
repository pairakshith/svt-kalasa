    <nav class="main-nav">
        <a href="../index.html" class="nav-link" data-trans-id="nav.home">ಮುಖ ಪುಟ</a>

    <main class="container">
        <div class="page-header">
            <h2 class="kn-heading" data-trans-id="references_page.page_title">ಉಲ್ಲೇಖಗಳು ಹಾಗೂ ಗ್ರಂಥ ಋಣ</h2>
            <p class="kn-subheading" data-trans-id="references_page.page_subtitle">ಈ ಜಾಲತಾಣದ ಮಾಹಿತಿಗೆ ಬಳಸಲಾದ ಮೂಲ ಗ್ರಂಥಗಳು ಹಾಗೂ ಆಧಾರಗಳು</p>
        </div>

        <section class="content-section" id="referencesContent">
            <p style="text-align: center; color: #666;" data-trans-id="common.loading">ಮಾಹಿತಿಯನ್ನು ಲೋಡ್ ಮಾಡಲಾಗುತ್ತಿದೆ...</p>
        </section>

    <!-- Common Footer Placeholder -->
    <div id="footerContainer"></div>

    <!-- JS Loader -->
    <script src="../js/footer-loader.js"></script>

    <!-- <script src="../js/vendor/sanscript.min.js"></script>
    <script src="../js/localeEngine.js"></script> -->
    <script src="../js/back-to-top.js"></script>
    <script src="../js/feedback.js"></script>

    <script>
        async function loadReferencesMarkdown() {
            const contentSection = document.getElementById('referencesContent');
            try {
                const response = await fetch('../data/references.md');
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                
                let markdownText = await response.text();

                // Preprocess directives if LocaleEngine is loaded
                if (window.LocaleEngine && typeof window.LocaleEngine.preprocessMarkdown === 'function') {
                    markdownText = window.LocaleEngine.preprocessMarkdown(markdownText);
                }
                
                // Render raw markdown into HTML
                let rawHtml = marked.parse(markdownText);

                // Transform blockquotes to note-box highlights
                rawHtml = rawHtml.replace(/<blockquote>\s*<p>(.*?)<\/p>\s*<\/blockquote>/gi, '<div class="note-box highlight"><p>$1</p></div>');

                contentSection.innerHTML = rawHtml;

                // Apply translations to dynamically parsed markdown
                if (window.LocaleEngine && typeof window.LocaleEngine.updateDomElements === 'function') {
                    window.LocaleEngine.updateDomElements(contentSection);
                }

            } catch (error) {
                console.error("Error loading references.md:", error);
                contentSection.innerHTML = `
                    <div style="text-align: center; color: #cc0000; padding: 20px;">
                        <p><strong>ಮಾಹಿತಿಯನ್ನು ಲೋಡ್ ಮಾಡಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ.</strong></p>
                        <p style="font-size: 0.85em; color: #666;">(ಫೈಲ್ ಮಾರ್ಗ <code>../data/references.md</code> ಸರಿಯಾಗಿದೆಯೇ ಎಂದು ಪರಿಶೀಲಿಸಿ)</p>
                    </div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadReferencesMarkdown);
        if (window.LocaleEngine) {
            window.LocaleEngine.onLanguageChange(function() {
                loadReferencesMarkdown();
            });
        }
    </script>

</body>
</html>
